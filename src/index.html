<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist To-Do List</title>
</head>
<body>
  <main class="app-wrapper">
    <div class="todo-card">
      <header class="card-header">
        <h2>Today's To Do</h2>
       <button type="button" class="refresh-btn">&#8635;</button>
      </header>
      
      <div class="input-container">
        <input type="text" placeholder="Add to your list..." disabled />
        <span class="enter-icon">&#8629;</span>
      </div>

      <ul id="todo-list"></ul>

      <footer class="card-footer">
       <button type="button" class="clear-btn">Clear all completed</button>
      </footer>
    </div>
  </main>
</body>
</html>
